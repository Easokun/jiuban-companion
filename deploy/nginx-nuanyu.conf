# 暖语 · nginx 配置（放到 /etc/nginx/conf.d/nuanyu.conf）
# 说明：limit_req_zone 必须定义在 http 上下文，conf.d 下的文件正好处于 http 内

# 按 IP 限流：每分钟 30 次，突发 10 次（应用层还有一层更细的限流）
limit_req_zone $binary_remote_addr zone=nuanyu_api:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # 上传体积限制（对话请求很小，留一点余量即可）
    client_max_body_size 1m;

    # 静态页面
    root /opt/nuanyu/static;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 大模型代理：关闭缓冲，保证流式输出不卡顿
    location /api/ {
        limit_req zone=nuanyu_api burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 健康检查不需要限流
    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;
}
